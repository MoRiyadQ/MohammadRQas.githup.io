<!-- Simplified version of scan_history.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Same head as scan_history.html -->
</head>
<body class="bg-dark text-light">
    <header class="bg-black text-white py-3">
        <div class="container d-flex justify-content-between">
            
            <h1>Scan Reports for {{ client_name }}</h1></div>
            <nav>
                <a href="{{ url_for('client_logout') }}" class="text-light green-border">Logout</a>
            </nav>
        </div>
    </header>

    <div class="container my-5">
        <table class="table table-dark">
            <!-- Simplified table with just essential info -->
            <thead>
                <tr>
                    <th>Report ID</th>
                    <th>Scan Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for scan in scans %}
                <tr>
                    <td>{{ scan.id }}</td>
                    <td>{{ scan.timestamp.strftime('%Y-%m-%d') }}</td>
                    <td>
                        <a href="{{ url_for('client_scan_details', scan_id=scan.id) }}" 
                           class="btn btn-sm btn-success">
                           View Report
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
